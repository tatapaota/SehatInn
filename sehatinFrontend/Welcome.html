<!DOCTYPE html>
<html lang="id">
  <head>
    <!-- Metadata halaman -->
    <meta charset="UTF-8" />
    <!-- Set karakter encoding ke UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Responsif untuk berbagai ukuran layar -->
    <title>Welcome - Sehat In</title>
    <!-- Judul tab browser -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- Link ke stylesheet eksternal -->
  </head>
  <body>
    <!-- Container utama layar welcome -->
    <div class="welcome-screen">
      <!-- Konten teks dan tombol -->
      <div class="content">
        <!-- Judul sambutan utama -->
        <h2>
          Halo, Selamat Datang di <span>"<b>Sehat In</b>"</span>!
        </h2>

        <!-- Pengenalan singkat aplikasi -->
        <p class="intro">
          <b
            >Pengingat minum obat yang membantu kamu menjaga kesehatan lebih
            teratur</b
          >
          <!-- Tagline utama aplikasi -->
        </p>

        <!-- Deskripsi fitur dan ajakan untuk mendaftar -->
        <p class="desc">
          <i
            >"Catat jadwal obat, dapatkan pengingat otomatis, dan tetap sehat
            tanpa khawatir lupa."</i
          ><br /><br />
          <!-- Penjelasan fitur utama -->
          <i>Daftar Sekarang!</i>
          <!-- Call to action -->
        </p>

        <!-- Container untuk tombol navigasi -->
        <div class="button-container">
          <!-- Tombol untuk halaman registrasi (primary action) -->
          <a href="register.html" class="btn">Daftar</a>

          <!-- Tombol untuk halaman login (secondary action) -->
          <a href="Login.html" class="btn-outline">Log In</a>
        </div>
      </div>

      <!-- Gambar dekorasi di halaman welcome -->
      <img src="aset/obat-dekorasi.png" class="decor" alt="Dekorasi" />
    </div>
  </body>
</html>
